name: Mirror to Gitee
on:
  schedule:
    - cron: '23 18 * * *'   # 每天北京时间 02:23
  workflow_dispatch: {}      # 支持手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Push main to Gitee (单分支,避开 Gitee 1GB 配额)
        run: |
          git clone --bare --single-branch --branch main https://github.com/NousResearch/hermes-agent.git repo
          cd repo
          git push --force "https://yngeek:${{ secrets.GITEE_TOKEN }}@gitee.com/yngeek/hermes-agent.git" main:main
